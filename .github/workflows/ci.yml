name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    # Release bundles are built on Ubuntu 24.04, so the tests run there too.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same Node the release bundle ships (packaging/downloads.sh).
      - name: Read the bundled Node version
        id: node
        run: echo "version=$(sed -n 's/^NODE_VERSION=//p' packaging/downloads.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Tests
        run: npx vitest run
